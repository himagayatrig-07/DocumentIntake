[project]
name = "document-intake"
version = "0.1.0"
description = "LLM-powered pipeline that turns invoices into structured data, with human review for low-confidence results."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.123",
    "pydantic>=2.9",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "moto[server]>=5.2.5",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_intake"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
